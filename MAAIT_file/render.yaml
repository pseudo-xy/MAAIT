# Render Blueprint: New > Blueprint, pick this repository, then fill in the passcode.
services:
  - type: web
    name: maait-simulator
    runtime: docker
    plan: free            # free sleeps after 15 min idle and does not keep files; see DEPLOY.md
    healthCheckPath: /
    envVars:
      - key: MAAIT_ADMIN_PASSCODE
        sync: false       # Render asks you for it when you create the service
